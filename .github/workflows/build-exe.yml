name: Build exe and publish release

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allow manual rebuild from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller google_100_tabs.spec --noconfirm

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.
          files: dist/google_100_tabs.exe
          fail_on_unmatched_files: true
