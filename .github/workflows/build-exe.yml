name: Build exe and publish release

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allow manual rebuild from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path google_100_tabs.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "APP_VERSION=$ver"
          echo "APP_VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: pyinstaller google_100_tabs.spec --noconfirm

      - name: Write version file
        shell: pwsh
        run: |
          "v${{ steps.version.outputs.APP_VERSION }}-b${{ github.run_number }}" | Set-Content -Path dist/latest_version.txt -NoNewline

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.APP_VERSION }}-b${{ github.run_number }}
          name: LeadReach v${{ steps.version.outputs.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Automatic build of commit ${{ github.sha }}.
          files: |
            dist/google_100_tabs.exe
            dist/latest_version.txt
          fail_on_unmatched_files: true
